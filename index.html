            <button onclick="refreshTime()" style="margin-top: 15px; background: #3498db;">🔄 refresh</button>

<script>
    function updateTime() {
        const timeElem = document.getElementById('currentTime');
        if (timeElem) {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const weekdays = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const weekday = weekdays[now.getDay()];
            
            const timeString = `${hours}:${minutes}:${seconds}`;
            const dateString = `${year}.${month}.${day} ${weekday}`;
            
            timeElem.innerHTML = `${timeString}<span style="font-size: 1rem; display: block; color: #7f8c8d;">${dateString}</span>`;
        }
    }

    function refreshTime() {
        updateTime();
        const btn = event.target;
        btn.style.transform = 'scale(0.95)';
        setTimeout(() => { btn.style.transform = ''; }, 150);
    }

    updateTime();
    setInterval(updateTime, 1000);
</script>
